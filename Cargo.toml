[package]
name = "elafra"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "A two-window PDF presentation tool"

[dependencies]
anyhow = "1"
async-channel = "2"
directories = "6"
gpui-kit = "=0.10.0"
image = { version = "0.25", default-features = false }
pdfium-render = { version = "=0.9.6", default-features = false, features = ["pdfium_8125", "thread_safe"] }
rfd = "=0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["randr"] }
